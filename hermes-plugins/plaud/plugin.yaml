name: plaud
version: 1.2.0
description: "Search and read a personal Plaud voice-recorder library (meetings, calls, memos) — recordings, AI summaries and transcripts. Read-only."
author: "Cuate (github.com/kidem42/Cuate)"
license: MIT
kind: standalone
platforms: [linux, macos]
provides_tools:
  - plaud_find
  - plaud_get_note
  - plaud_get_transcript
optional_env:
  - name: PLAUD_ACCESS_TOKEN
    description: "Plaud OAuth access token. Normally set by `hermes plaud login`, which stores the grant under $HERMES_HOME/plaud/auth.json."
    password: true
  - name: PLAUD_REFRESH_TOKEN
    description: "Plaud OAuth refresh token; lets the plugin renew the access token by itself."
    password: true
  - name: PLAUD_REFERENCE_STYLE
    description: "How recordings are referenced in answers: marker (default, plaud://<id> — card-rendering clients pick it up), link (deep link into Plaud), or id."
