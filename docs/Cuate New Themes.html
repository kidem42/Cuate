/* ═══════════════════════════════════════════════════════════════════
   THE FRAME IS 1:1 WITH THE APP'S CODE (pt → px):
   ChatWindow: header h22 (icons h20, pad 12, top 5, spacing 12);
   composer HStack(bottom,8) pad h12 b12; paperclip 14 in 24×27; field r6
   pad ~11/7 text 13; mic 32; send 32 (custom 34); panel r18.
   MessageRow: bubble pad 12×8, a UNIFORM radius (no tail), maxW 75%,
   ts caption2(10) mono option; the assistant glyph .caption(12) INSIDE the bubble.
   RecordingStatusView: dot 7, time 12 mono, hint 11, pad 12×5.
   DictationWidget: 148×34 / 182×34, bars 2.5/2.5, language chip 10 rounded.
   VoiceMessagePlayer: waveform h24 (bars 2/2), play 28, time caption2.
   AgentApprovalCard: title 13 ink, subject 12 mono on codeFill r6,
   buttons 13 (prominent=accent). StepJournal: chevron 9 + "Steps · N" 11.
   WorldTimeView: panel minW 1000 r18, pad h16; top bar: ✕15 pin13
   search capsule(+11, field 230, pad 10×6) … link 11 underlined,
   AM/PM|24 (10.5, pad 9×3, r6), gear 13; dateStrip: calendar +
   7 days (selected "Dec 25" capsule pad 10×4, the rest 12pt pad 7×4);
   busy: caption 9 + track 3 + blocks 8 in the CALENDAR's color; rows h46 sp8,
   header 250 (offset 36 "+7" 12 mono | city 13 + TZ chip 9 + country
   caption2 | clock 13 mono + date on the right, pad-r 10); a band of 24 cells r12,
   separators 0.5 inset 6, hour 13 semibold mono; midnight is a date chip
   EEE 7.5 / d 12 / MMM 7.5 on wt-mid; "now" is a dashed line INSIDE the cell;
   the selection is a column cellW+4 h+6 r9 fill+stroke2+glow across all rows.
   ═══════════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth}
body{background:#101216;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Helvetica,sans-serif}

@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@keyframes flicker{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.9)}}
@keyframes twinkle{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.45;filter:brightness(.7)}}
@keyframes starTw{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.25;transform:scale(.75)}}
@keyframes fall{0%{transform:translateY(-30px)}100%{transform:translateY(600px)}}
@keyframes fallSway{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(9px) rotate(18deg)}}
@keyframes ribbon{0%,100%{transform:translateX(0) skewX(0) scaleY(1);opacity:.8}
  33%{transform:translateX(14px) skewX(-4deg) scaleY(1.12);opacity:1}
  66%{transform:translateX(-10px) skewX(3deg) scaleY(.92);opacity:.65}}
@keyframes shoot{0%,92%{opacity:0;transform:translate(0,0)}94%{opacity:.9}100%{opacity:0;transform:translate(-90px,54px)}}
@keyframes steam{0%{opacity:0;transform:translateY(4px) scaleX(1)}30%{opacity:.75}
  70%{opacity:.35;transform:translateY(-9px) scaleX(1.25)}100%{opacity:0;transform:translateY(-15px) scaleX(.8)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 6px var(--send-glow))}50%{filter:drop-shadow(0 0 13px var(--send-glow))}}
@keyframes selPulse{0%,100%{box-shadow:0 0 0 0 var(--wt-sel-glow)}50%{box-shadow:0 0 10px 1px var(--wt-sel-glow)}}
@keyframes nowBlink{0%,60%{opacity:.9}80%,100%{opacity:.4}}
@keyframes candyTurn{to{transform:translateX(16.9706px)}}
@keyframes snowGrow{0%{transform:scaleY(0);opacity:0}10%{opacity:1}100%{transform:scaleY(1);opacity:1}}
@keyframes drip{0%,72%{transform:translateY(0);opacity:0}76%{opacity:.9}96%{transform:translateY(9px);opacity:.9}100%{transform:translateY(10px);opacity:0}}

/* An SF symbol as a mask: the real glyph, tinted with currentColor */
.sf{display:inline-block;flex:none;background:currentColor;
  -webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain}

/* ── the stage and the panel (r18, inset 16 — like the floating panel) ── */
.stage{width:400px;border-radius:14px;position:relative;overflow:hidden;background:var(--wall);flex:none}
.stage.chat{height:560px}
.badge{position:absolute;left:10px;top:10px;font:600 10px ui-monospace,monospace;color:var(--badge);z-index:9}
.panel{position:absolute;inset:16px;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid var(--panel-border);box-shadow:inset 0 1px 0 var(--panel-inset),0 18px 40px rgba(0,0,0,.45);
  font-family:var(--font,inherit);color:var(--text)}
.sheet{margin:16px;border-radius:18px;display:flex;flex-direction:column;gap:12px;padding:30px 14px 14px;position:relative;
  background:var(--panel);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid var(--panel-border);box-shadow:inset 0 1px 0 var(--panel-inset),0 18px 40px rgba(0,0,0,.4);
  font-family:var(--font,inherit);color:var(--text)}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
/* the snow cap: grows from zero over ~45 s and stays (transform-origin at the bottom) */
.scap{position:absolute;z-index:3;transform-origin:bottom;transform:scaleY(0);
  animation:snowGrow 45s linear forwards;border-radius:60% 40% 50% 50%/100% 100% 0 0}
.scap i{position:absolute;top:-3px;border-radius:50% 50% 40% 40%/100% 100% 0 0;background:inherit;height:5px}

/* ── the panel header: pin·folder·provider · … · presets·│·new chat·⚙ ── */
.phead{height:22px;display:flex;align-items:center;gap:12px;padding:5px 12px 0;position:relative;z-index:2;color:var(--sec)}
.phead .lead{display:flex;align-items:center;gap:12px;height:20px}
.phead .chip{display:flex;align-items:center;gap:4px;font-size:11px;height:20px}
.phead .logo{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--sec)}
.phead .sp{flex:1}
.phead .preset{width:20px;height:20px;display:grid;place-items:center}
.phead .preset{font-size:12px}
.phead .vr{width:1px;height:12px;background:var(--sec);opacity:.3}

/* ── the thread ── */
.thread{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:8px 16px;position:relative;z-index:2}
.msg{max-width:75%;display:flex;flex-direction:column;gap:4px}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.bot{align-self:flex-start}
.bub{font-size:13px;line-height:1.45;padding:8px 12px;backdrop-filter:blur(8px);
  box-shadow:0 1px 2.5px rgba(0,0,0,.1);border-radius:var(--r)}
.msg.user .bub{--r:var(--user-r);background:var(--user-fill);color:var(--user-text);border:var(--user-border,none)}
.msg.bot .bub{--r:var(--bot-r);background:var(--bot-fill);color:var(--text);border:var(--bot-border,none);
  display:flex;flex-direction:column;gap:8px}
.msg .glyph{height:14px;display:flex;align-items:center;font-size:12px}
.ts{color:var(--sec);font-size:10px}
.status{display:flex;align-items:center;gap:6px;color:var(--sec);font-size:11px;
  align-self:flex-start;padding:5px 11px;border-radius:999px;background:var(--panel);
  backdrop-filter:blur(12px);border:1px solid var(--field-stroke)}
.candy{width:44px;height:11px;border-radius:5.5px;flex:none;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.2)}
.candy::before{content:'';position:absolute;top:0;bottom:0;left:-24px;right:-24px;
  background:repeating-linear-gradient(45deg,#E5484D 0 5.5px,#FFF6EC 6px 11.5px,#E5484D 12px);
  animation:candyTurn .8s linear infinite;will-change:transform}
.candy::after{content:'';position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 -2.5px 3px rgba(0,0,0,.22),inset 0 2px 2.5px rgba(255,255,255,.45)}
.eq{display:flex;gap:3px;align-items:center}
.eq i{width:3px;border-radius:1.5px;background:var(--accent);animation:eq .9s ease-in-out infinite}

/* ── the composer ── */
.compwrap{display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}
.divider{height:0;border-top:var(--divider)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:0 12px 12px}
.clipbtn{width:24px;height:27px;display:grid;place-items:center;color:var(--ink)}
.field{flex:1;min-height:36px;border-radius:var(--field-r);background:var(--field);
  border:1px solid var(--field-stroke);display:flex;align-items:center;padding:0 0 0 11px;
  color:var(--ph);font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.mic{width:32px;height:32px;border-radius:var(--mic-r);background:var(--mic-bg);border:var(--mic-border);
  display:grid;place-items:center;flex:none;color:var(--mic-c)}
.send{width:34px;height:34px;display:grid;place-items:center;flex:none;animation:glowPulse 3s ease-in-out infinite}
.send .circle{width:32px;height:32px;border-radius:50%;background:var(--send-fill);display:grid;place-items:center;color:var(--send-glyph)}

/* ── components ── */
.lbl{color:var(--sec);font:600 9px ui-monospace,monospace;letter-spacing:.1em;opacity:.85}
.blk{display:flex;flex-direction:column;gap:6px;position:relative;z-index:2}
.dcap{height:34px;border-radius:17px;background:var(--panel);backdrop-filter:blur(12px);
  border:1px solid var(--field-stroke);display:flex;align-items:center;justify-content:center;gap:8px;flex:none}
.deq{display:flex;gap:2.5px;align-items:center}
.deq i{width:2.5px;border-radius:1.5px;animation:eq .9s ease-in-out infinite}
.langchip{font:700 10px ui-rounded,-apple-system,sans-serif;color:var(--chip-c);background:var(--chip-bg);
  border:1px solid var(--chip-stroke);border-radius:999px;padding:2.5px 6px}
.recpill{align-self:center;display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
  background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--rec)}
.recpill .dot{width:7px;height:7px;border-radius:50%;background:var(--rec);box-shadow:0 0 7px var(--rec-glow);
  animation:flicker 1.6s ease-in-out infinite}
.recpill b{color:var(--text);font:500 12px ui-monospace,monospace}
.recpill span{color:var(--sec);font-size:11px}
.voice{align-self:flex-end;width:75%;border-radius:var(--user-r);background:var(--user-fill);
  border:var(--user-border,none);padding:10px 12px 8px;display:flex;flex-direction:column;gap:4px}
.voice .vrow{display:flex;align-items:center;gap:10px}
.wave{display:flex;gap:2px;align-items:center;height:24px}
.wave i{width:2px;border-radius:1px;background:var(--wave)}
.wave i.p{background:var(--wave-p)}
.voice .row2{display:flex;align-items:center;gap:8px}
.voice .dur{color:var(--user-text);font-size:10px;opacity:.85}
.attachcard{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;
  background:var(--field);border:1px solid var(--field-stroke);width:max-content}
.attachcard .thumbwrap{position:relative;width:110px;display:block}
.attachcard .thumb{display:block;width:110px;height:80px;border-radius:8px;background:linear-gradient(140deg,#7fb4a2,#c9b083)}
.attachcard .x{position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;
  background:rgba(30,30,34,.85);color:#fff;display:grid;place-items:center;font-size:10px}
.attachcard b{font-size:12px;color:var(--text);font-weight:400}
.retry{display:flex;align-items:center;gap:6px;width:max-content;padding:4px 12px;border-radius:7px;
  border:1px solid var(--field-stroke);color:var(--text);font-size:12px;background:var(--field)}

/* ── markdown ── */
.md{border-radius:var(--bot-r);background:var(--bot-fill);border:var(--bot-border,none);
  padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.md h3{font-size:15px;font-weight:700;color:var(--text)}
.md .li{display:flex;gap:7px;font-size:13px;line-height:1.45;color:var(--text)}
.md .li b{color:var(--accent);font-weight:400;flex:none}
.md .code{border-radius:8px;background:var(--code-bg);border:1px solid var(--code-stroke);overflow:hidden}
.md .code .bar{display:flex;align-items:center;justify-content:space-between;padding:4px 9px 0;color:var(--sec);
  font:600 8.5px ui-monospace,monospace;letter-spacing:.08em}
.md .code pre{padding:3px 9px 7px;color:var(--code-c);font:11.5px ui-monospace,monospace}
.md .p{font-size:13px;line-height:1.45;color:var(--text)}
.md .inline{background:var(--code-bg);color:var(--code-c);border-radius:4px;padding:.5px 5px;font:11px ui-monospace,monospace}
.md a{color:var(--link);text-decoration:underline;cursor:default}
.md .quote{display:flex;gap:8px}
.md .quote i{width:3px;border-radius:2px;background:var(--quote);flex:none}
.md .quote span{color:var(--sec);font-size:13px;line-height:1.45;font-style:italic}
.md .tbl{border-radius:6px;overflow:hidden;border:1px solid var(--code-stroke);display:grid;grid-template-columns:1fr 1fr}
.md .tbl span{padding:5px 9px;font-size:12px;border-bottom:1px solid var(--code-stroke);color:var(--text)}
.md .tbl .h{background:var(--code-bg);font-weight:600}
.md .tbl span:nth-last-child(-n+2){border-bottom:none}
.md .hr{height:1px;background:var(--ink);opacity:.18;border-radius:1px}
.mmd{border-radius:8px;background:var(--code-bg);border:1px solid var(--code-stroke);padding:10px;display:flex;justify-content:center}
.art{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--code-bg);border:1px solid var(--code-stroke)}
.art .t{display:flex;flex-direction:column;gap:1px;flex:1}
.art b{font-size:12px;color:var(--text)}
.art span{font-size:10px;color:var(--sec)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;
  background:var(--pill-fill);border:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);
  color:var(--ink);font-size:11px}

/* ── agent surfaces ── */
.approve{border-radius:var(--bot-r);background:var(--bot-fill);border:var(--bot-border,none);
  padding:8px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2.5px rgba(0,0,0,.1)}
.approve .ttl{font-size:13px;color:var(--ink)}
.approve .subj{font:12px ui-monospace,monospace;color:var(--code-c);background:var(--code-bg);
  border-radius:6px;padding:8px}
.approve .btns{display:flex;gap:8px}
.abtn{padding:3px 10px;border-radius:5px;font-size:13px}
.abtn.prominent{background:var(--accent);color:#fff}
.abtn.bordered{border:1px solid var(--field-stroke);color:var(--accent)}
.steps{display:flex;flex-direction:column;gap:4px}
.steps .head{display:flex;align-items:center;gap:4px;color:var(--sec);font-size:11px}
.steps .row{display:flex;align-items:baseline;gap:6px;padding-left:14px;font-size:11px}
.steps .row .tool{font-family:ui-monospace,monospace;color:var(--text)}
.steps .row .det{color:var(--sec)}
.steps .ok{color:#34c759;font-size:9px}
.rolechip{display:flex;align-items:center;gap:6px;width:max-content;padding:3px 10px;border-radius:999px;
  background:var(--chip-bg);border:1px solid var(--chip-stroke);font-size:11px;color:var(--text)}
.rolechip .dot{width:6px;height:6px;border-radius:50%;background:#34c759}

/* ── world time (panel minW 1000) ── */
.wtstage{width:1032px;border-radius:14px;position:relative;overflow:hidden;background:var(--wall)}
.wtpanel{margin:16px;border-radius:18px;position:relative;overflow:hidden;padding:4px 16px 14px;
  display:flex;flex-direction:column;gap:10px;
  background:var(--panel);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid var(--panel-border);box-shadow:inset 0 1px 0 var(--panel-inset),0 16px 36px rgba(0,0,0,.4);
  font-family:var(--font,inherit);color:var(--text)}
.drag{height:16px;display:grid;place-items:center}
.drag i{width:36px;height:4px;border-radius:2px;background:var(--sec);opacity:.35}
.wtbar{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.wtsearch{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--wt-capsule)}
.wtsearch span{width:230px;font-size:13px;color:var(--ph)}
.wtlink{font-size:11px;font-weight:500;text-decoration:underline;color:var(--link)}
.seg{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--field-stroke)}
.seg i{font:600 10.5px -apple-system,sans-serif;font-style:normal;padding:3px 9px;color:var(--sec)}
.seg i.on{background:var(--chip-bg);color:var(--text)}
.dstrip{display:flex;align-items:center;gap:4px;position:relative;z-index:2;color:var(--sec)}
.dstrip .day{font-size:12px;color:var(--sec);padding:4px 7px}
.dstrip .day.wknd{color:var(--wt-weekend)}
.dstrip .day.sel{font-weight:600;color:var(--text);background:var(--chip-bg);border-radius:999px;padding:4px 10px}
.busylane{display:flex;align-items:center;position:relative;z-index:2}
.busylane .cap{width:238px;flex:none;text-align:right;padding-right:12px;
  font:600 9px -apple-system,sans-serif;color:var(--sec);opacity:.8}
.busylane .track{position:relative;flex:1;height:12px}
.busylane .rail{position:absolute;left:0;right:0;top:4.5px;height:3px;border-radius:2px;background:var(--wt-capsule)}
.busylane .bl{position:absolute;top:2px;height:8px;border-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.15);
  border:1px solid color-mix(in srgb,var(--text) 55%,transparent)}
.wtgrid{position:relative;z-index:2;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.wtrow{display:flex;align-items:center;height:46px}
.rowhead{width:250px;flex:none;display:flex;align-items:center;gap:8px}
.rowhead .off{width:36px;flex:none;text-align:right;font:600 12px -apple-system,sans-serif;
  font-variant-numeric:tabular-nums;color:var(--sec)}
.rowhead .names{display:flex;flex-direction:column;gap:1px;min-width:0}
.rowhead .cityline{display:flex;align-items:center;gap:5px}
.rowhead .city{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.rowhead .abbr{font-size:9px;font-weight:500;padding:1px 4px;border-radius:999px;background:var(--chip-bg);color:var(--sec)}
.rowhead .country{font-size:10px;color:var(--sec)}
.rowhead .clock{margin-left:auto;padding-right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.rowhead .clock b{font-size:13px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.rowhead .clock span{font-size:10px;color:var(--sec)}
.band{display:flex;flex:1;height:46px;border-radius:12px;overflow:hidden;position:relative;
  outline:.5px solid var(--field-stroke);outline-offset:-.5px}
.cell{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  font-variant-numeric:tabular-nums;color:var(--text)}
.cell.dk{color:var(--wt-darktext)}
.cell+.cell::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:.5px;background:var(--field-stroke)}
.cell .h{font-size:13px;font-weight:600}
.cell .mEEE{font-size:7.5px;font-weight:700}
.cell .mD{font-size:12px;font-weight:700}
.cell .mMMM{font-size:7.5px;font-weight:600}
.cell .noww{position:absolute;left:15%;right:15%;bottom:4px;border-bottom:2px dashed var(--wt-now);
  animation:nowBlink 2.2s ease-in-out infinite}
.selcol{position:absolute;z-index:4;border-radius:9px;background:var(--wt-sel-bg);
  border:var(--wt-sel-border);animation:selPulse 2.6s ease-in-out infinite;pointer-events:none}

/* ── the page ── */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 16px;background:rgba(16,18,22,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1)}
.nav b{color:#fff;font-size:13px;margin-right:6px}
.nav a{color:#9fb2c8;font-size:11px;text-decoration:none;padding:4px 9px;border-radius:999px;
  background:#1c2129;border:1px solid rgba(255,255,255,.08)}
.nav a:hover{color:#fff;background:#2c3340}
.nav .g{color:rgba(255,255,255,.35);font-size:11px;margin-left:6px}
.sect{display:flex;align-items:center;gap:12px;padding:0 4px}
.sect .tag{background:#2c3340;color:#9fb2c8;font:600 11px ui-monospace,monospace;padding:5px 9px;border-radius:6px}
.sect .ttl{color:#fff;font-size:17px;font-weight:600}
.sect a{color:#6ab7ff;font-size:11px;text-decoration:none;margin-left:4px}
.note{color:rgba(255,255,255,.45);font-size:11px;padding:0 4px}
main{max-width:1080px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:30px}
.pair{display:flex;gap:20px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px}

/* ── Yule — Christmas ── */
.yule.dark{--wt-darktext:#cfe8d4;
  --wall:radial-gradient(120% 90% at 25% 10%,#1c3a28 0%,#0f2718 55%,#071108 100%);
  --panel:rgba(14,36,22,.45);--panel-border:rgba(242,193,78,.30);--panel-inset:rgba(180,240,190,.16);
  --text:#eefaf0;--sec:rgba(190,230,200,.65);--accent:#E5484D;--ink:#F2C14E;

  --field:rgba(242,193,78,.07);--field-stroke:rgba(242,193,78,.32);--field-r:6px;--ph:rgba(190,230,200,.45);

  --eq1:#E5484D;--eq2:#F2C14E;--eq3:#58B368;
  --code-bg:rgba(242,193,78,.1);--code-c:#f5d896;--code-stroke:rgba(242,193,78,.25);
  --quote:#F2C14E;--link:#F2C14E;
  --wave:rgba(255,255,255,.35);--wave-p:#F2C14E;--play-bg:#fff0ef;--play-c:#5c1520;
  --rec:#E5484D;--rec-glow:rgba(229,72,77,.8);
  --chip-bg:rgba(242,193,78,.12);--chip-stroke:rgba(242,193,78,.4);--chip-c:#f5d896;
  --wt-mid:#0a2015;--wt-night:rgba(38,96,62,.6);--wt-dawn:rgba(242,193,78,.55);
  --wt-day:rgba(255,248,235,.72);--wt-dusk:rgba(229,72,77,.5);
  --wt-sel-border:1.5px solid #F2C14E;--wt-sel-bg:rgba(242,193,78,.13);--wt-sel-glow:rgba(242,193,78,.45);

.yule.light{--wt-darktext:#e8f2e9;
  --wall:radial-gradient(120% 90% at 25% 10%,#f4f1e8 0%,#dde6dc 55%,#b7cdbb 100%);
  --panel:rgba(253,250,243,.55);--panel-border:rgba(255,255,255,.78);--panel-inset:rgba(255,255,255,.9);
  --text:#233324;--sec:rgba(60,95,65,.72);--accent:#C43C42;--ink:#A87718;
  --user-fill:rgba(225,95,100,.5);--user-text:#3d0d12;--user-r:16px;
  --bot-fill:rgba(255,255,255,.72);--bot-border:1px solid rgba(168,119,24,.25);--bot-r:16px;
  --field:rgba(255,255,255,.6);--field-stroke:rgba(168,119,24,.35);--field-r:6px;--ph:rgba(60,95,65,.5);
  --divider:1px dashed rgba(168,119,24,.35);
  --mic-border:1px solid rgba(168,119,24,.5);--mic-bg:rgba(255,255,255,.55);--mic-c:#A87718;--mic-r:9px;
  --send-fill:#C43C42;--send-glyph:#fff;--send-glow:rgba(196,60,66,.45);
  --eq1:#C43C42;--eq2:#A87718;--eq3:#3E7A4E;
  --code-bg:rgba(168,119,24,.1);--code-c:#7a5410;--code-stroke:rgba(168,119,24,.25);
  --quote:#A87718;--link:#8a6210;
  --wave:rgba(61,13,18,.3);--wave-p:#8a6210;--play-bg:#fff;--play-c:#8a1f26;
  --rec:#C43C42;--rec-glow:rgba(196,60,66,.6);
  --chip-bg:rgba(168,119,24,.1);--chip-stroke:rgba(168,119,24,.4);--chip-c:#7a5410;
  --wt-mid:rgba(23,52,38,.88);--wt-night:rgba(62,122,78,.45);--wt-dawn:rgba(242,193,78,.55);
  --wt-day:rgba(255,255,255,.72);--wt-dusk:rgba(196,60,66,.4);
  --wt-sel-border:1.5px solid #C43C42;--wt-sel-bg:rgba(196,60,66,.12);--wt-sel-glow:rgba(196,60,66,.35);
  --wt-chip-bg:#C43C42;--wt-chip-c:#fff;--wt-now:#A87718;
  --wt-capsule:rgba(255,255,255,.6);--wt-weekend:rgba(196,60,66,.12)}

/* ── Aurora — the polar night ── */
.aurora.dark{--wt-darktext:#cfe6f2;
  --wall:linear-gradient(170deg,#050f1e 0%,#081827 55%,#0a2230 100%);
  --panel:rgba(10,26,46,.45);--panel-border:rgba(111,227,255,.28);--panel-inset:rgba(140,230,255,.16);

  --field:rgba(74,227,181,.06);--field-stroke:rgba(111,227,255,.28);--field-r:6px;--ph:rgba(160,220,235,.45);
  --divider:1px solid rgba(111,227,255,.18);
  --mic-border:1px solid rgba(111,227,255,.5);--mic-bg:rgba(111,227,255,.1);--mic-c:#8de9ff;--mic-r:50%;
  --send-fill:linear-gradient(135deg,#4AE3B5,#7D6CFF);--send-glyph:#fff;--send-glow:rgba(74,227,181,.55);
  --eq1:#4AE3B5;--eq2:#6FE3FF;--eq3:#7D6CFF;
  --code-bg:rgba(111,227,255,.09);--code-c:#9ff0e2;--code-stroke:rgba(111,227,255,.22);
  --quote:#4AE3B5;--link:#6FE3FF;
  --wave:rgba(255,255,255,.35);--wave-p:#4AE3B5;--play-bg:#eafff7;--play-c:#083a2e;
  --rec:#4AE3B5;--rec-glow:rgba(74,227,181,.8);
  --chip-bg:rgba(111,227,255,.12);--chip-stroke:rgba(111,227,255,.4);--chip-c:#9ff0e2;
  --wt-mid:rgba(6,14,32,.94);--wt-night:rgba(70,88,200,.45);--wt-dawn:rgba(74,227,181,.42);
  --wt-day:rgba(222,244,255,.6);--wt-dusk:rgba(125,108,255,.44);
  --wt-sel-border:1.5px solid #4AE3B5;--wt-sel-bg:rgba(74,227,181,.13);--wt-sel-glow:rgba(74,227,181,.5);
  --wt-chip-bg:#4AE3B5;--wt-chip-c:#04241a;--wt-now:#6FE3FF;
  --wt-capsule:rgba(111,227,255,.08);--wt-weekend:rgba(125,108,255,.16)}
.aurora.light{--wt-darktext:#e6ecfa;
  --wall:linear-gradient(170deg,#dfeef6 0%,#d3e3f2 55%,#bcd4e6 100%);
  --panel:rgba(244,250,253,.6);--panel-border:rgba(255,255,255,.8);--panel-inset:rgba(255,255,255,.95);
  --text:#0d2b33;--sec:rgba(30,100,120,.7);--accent:#0E9C8B;--ink:#5B4BD6;
  --user-fill:linear-gradient(120deg,rgba(64,196,160,.45),rgba(150,130,255,.4));--user-text:#0d2b33;--user-r:16px;
  --bot-fill:rgba(255,255,255,.72);--bot-border:1px solid rgba(14,156,139,.22);--bot-r:16px;
  --field:rgba(255,255,255,.6);--field-stroke:rgba(14,156,139,.3);--field-r:6px;--ph:rgba(30,100,120,.45);
  --divider:1px solid rgba(14,156,139,.22);
  --mic-border:1px solid rgba(14,156,139,.45);--mic-bg:rgba(255,255,255,.55);--mic-c:#0B7E70;--mic-r:50%;

<div>

    mirroring <span style="font-family:ui-monospace,monospace;font-size:12px">ThemePalette</span> / <span style="font-family:ui-monospace,monospace;font-size:12px">WorldTimeTheme</span>.

<script>
/* An SF icon: the real glyph as a mask, sized in pt as in the code */
const sf=(name,s,extra='')=>`<i class="sf" style="--u:var(--sf-${name.replaceAll('.','-')});width:${s}px;height:${s}px;${extra}"></i>`;

const eqBars=(n,h,cls='eq',w=null,base=null)=>{let s='';
  for(let i=0;i<n;i++){const c=w?`background:var(--eq${i%3+1});`:'';
    const hh=base!=null?(base+(h-base)*Math.abs(Math.sin(i*2.1))):(h*(0.55+0.45*Math.abs(Math.sin(i*2.1))));
    s+=`<i style="height:${hh.toFixed(0)}px;${c}animation-delay:${(i*.37%0.9).toFixed(2)}s"></i>`}
  return `<span class="${cls}">${s}</span>`};

/* the voice waveform: bars 2px/2px, h24, ~40% "played" */
const wave=()=>{const hs=[6,9,12,16,14,8,18,11,9,14,6,16,11,8,12,18,9,6,14,11,16,8,12,9,7,13];
  return `<span class="wave">${hs.map((h,i)=>`<i class="${i<10?'p':''}" style="height:${h}px"></i>`).join('')}</span>`};

const THEMES=[
{ id:'yule', name:'Yule — Christmas',
  note:'the bulbs twinkle · snow falls · "Thinking…" = a candy-cane cylinder with the spiral spinning on its side · send = a circle with a gold rim',
  glyph:`<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 4l4.6 6h-2.4l4.4 5.6h-3l3.4 4.4H5l3.4-4.4h-3L9.8 10H7.4z" fill="#3E7A4E"/><rect x="10.8" y="19.6" width="2.4" height="3" rx=".6" fill="#8C5A3C"/><path d="M12 .6l.9 1.9 2 .3-1.5 1.4.4 2L12 5.3l-1.8.9.4-2-1.5-1.4 2-.3z" fill="#F2C14E" style="animation:starTw 2.6s ease-in-out infinite;transform-origin:12px 3px"/><circle cx="10" cy="12" r="1" fill="#E5484D"/><circle cx="14" cy="15.5" r="1" fill="#F2C14E"/><circle cx="11" cy="17.5" r="1" fill="#6FB7E8"/></svg>`,
  send:`<span class="circle" style="box-shadow:inset 0 0 0 2.5px rgba(242,193,78,.8)">${sf('paperplane.fill',13)}</span>`,
  user:'Write a warm greeting for the team', t1:'22:08 ❄', t2:'22:09 ❄',
  bot:'"May production be as quiet as a snowfall, and every release feel like a present under the tree. Happy New Year! 🎄"',
  bullet:'❄', dictLang:'ES', dur:'0:07', voiceText:'One, two, three.',
  think:`<span class="candy"></span>`,
  fmt:{h:'Christmas Eve plan',items:['buy tangerines and cocoa','put together a "fireplace + jazz" playlist','hug everyone nearby'],
       lang:'SWIFT',code:'git tag -a v4.8 -m "🎄"',inline:'HolidayThemeManager',link:'Advent calendar',
       quote:'The best gift is a Friday deploy that stayed up.',tbl:[['Garland','twinkles'],['Snow','always falling']],artifact:'Greetings.html'},
  deco(dark,wt){
    const cols=['#E5484D','#F2C14E','#58B368','#6FB7E8'],
          fl=dark?'rgba(255,255,255,.85)':'rgba(120,150,170,.8)';
    let tops=[10,17,21,18,11,16,22,17,10,15]; if(wt)tops=tops.map(v=>v-9);
    const bw=wt?5:6,bh=wt?6:8;
    let h='';
    for(let i=0;i<10;i++){const c=cols[i%4];
      h+=`<span style="position:absolute;left:${5+i*10}%;top:${tops[i]}px;width:${bw}px;height:${bh}px;border-radius:45% 45% 50% 50%;background:${c};box-shadow:0 0 8px 1.5px ${c}${dark?'cc':'77'};animation:twinkle ${2+(i%3)*.5}s ease-in-out ${i*.35}s infinite"></span>`;}
    const flakes=wt?[[6,13,0],[50,16,-6],[92,14,-11]]:[[8,11,0],[24,14,-3],[43,9,-6],[58,13,-1.5],[72,10,-4.5],[88,12,-7.5],[33,15,-9],[80,12,-10],[50,12,-2.2],[16,10,-7]];
    for(const [x,d,dl] of flakes)
      h+=`<span style="position:absolute;left:${x}%;top:-24px;color:${fl};font-size:${wt?6:7}px;${wt?'opacity:.5;':''}animation:fall ${d}s linear ${dl}s infinite"><span style="display:inline-block;animation:fallSway ${(d/3.2).toFixed(1)}s ease-in-out infinite">❄</span></span>`;
    return h;
  }},
{ id:'aurora', name:'Aurora — the polar night',
  note:'the aurora ribbons breathe · the stars twinkle · a shooting star every 12 s · send = a gradient circle with a paperplane',
  glyph:`<svg width="13" height="13" viewBox="0 0 20 20" style="animation:starTw 3s ease-in-out infinite"><path d="M10 0l2.2 7.8L20 10l-7.8 2.2L10 20l-2.2-7.8L0 10l7.8-2.2z" fill="#5EEAD4"/></svg>`,
  send:`<span class="circle">${sf('paperplane.fill',13)}</span>`,
  user:'When is the northern lights display best?', t1:'23:41', t2:'23:41',
  bot:'The Kp index is 5.3 tonight — the odds are high: the window is 23:00–02:00, look north, away from the lights.',
  bullet:'✦', dictLang:'NO', dur:'0:11', voiceText:'One, two, three.',
  fmt:{h:'Aurora hunt',items:['check the Kp forecast after sunset','thermos, tripod, warm socks','exposure 4–8 s, ISO 1600'],
       lang:'PYTHON',code:'kp = get_forecast().kp  # 5.3',inline:'aurora_watch',link:'NOAA forecast',
       quote:'The sky does neon better than any designer.',tbl:[['Kp index','5.3'],['Window','23:00–02:00']],artifact:'Aurora-forecast.html'},
  deco(dark,wt){
    if(!dark) return `<span style="position:absolute;left:-14%;top:-8%;width:80%;height:42%;border-radius:50%;background:radial-gradient(closest-side,rgba(64,196,160,.26),transparent 70%);filter:blur(11px);animation:ribbon 12s ease-in-out infinite"></span>
      <span style="position:absolute;right:-18%;top:-2%;width:85%;height:48%;border-radius:50%;background:radial-gradient(closest-side,rgba(150,130,255,.24),transparent 70%);filter:blur(13px);animation:ribbon 15s ease-in-out 3s infinite"></span>`;
    let h=`<span style="position:absolute;left:-18%;top:-10%;width:85%;height:48%;border-radius:50%;background:radial-gradient(closest-side,rgba(61,232,176,.4),transparent 70%);filter:blur(11px);animation:ribbon 11s ease-in-out infinite"></span>
      <span style="position:absolute;right:-22%;top:-6%;width:90%;height:54%;border-radius:50%;background:radial-gradient(closest-side,rgba(125,108,255,.34),transparent 70%);filter:blur(13px);animation:ribbon 14s ease-in-out 2.5s infinite"></span>
      <span style="position:absolute;left:16%;top:-4%;width:70%;height:36%;border-radius:50%;background:radial-gradient(closest-side,rgba(111,227,255,.22),transparent 70%);filter:blur(10px);animation:ribbon 9s ease-in-out 5s infinite"></span>`;
    [[12,34,2],[30,16,1.5],[52,28,2],[76,20,1.5],[88,48,2],[22,66,1.5],[64,58,1.5],[41,46,1.5],[83,84,1.5],[8,96,1.5]]
      .forEach(([x,y,w],i)=>h+=`<span style="position:absolute;left:${x}%;top:${y}px;width:${w}px;height:${w}px;border-radius:50%;background:#fff;animation:starTw ${(2+(i%4)*.7).toFixed(1)}s ease-in-out ${i*.5}s infinite"></span>`);
    if(!wt) h+=`<span style="position:absolute;right:12%;top:30px;width:46px;height:1.5px;background:linear-gradient(90deg,rgba(255,255,255,.9),transparent);border-radius:2px;transform-origin:right;rotate:150deg;animation:shoot 12s linear 4s infinite"></span>`;
    return h;
  }},
{ id:'cafe', name:'Café — coffee',
  note:'beans and coffee ring stains (no cup) · send = an espresso: a dark circle with a crema rim',
  glyph:`<svg width="15" height="15" viewBox="0 0 24 24"><path d="M4 10h13v5.5A5.5 5.5 0 0 1 11.5 21h-2A5.5 5.5 0 0 1 4 15.5z" fill="#B0653A"/><path d="M17 11.5h1.6a2.7 2.7 0 0 1 0 5.4H16.4" stroke="#B0653A" stroke-width="1.6" fill="none"/><ellipse cx="10.5" cy="22.4" rx="8" ry="1.4" fill="rgba(140,90,60,.45)"/><path d="M8 7.5C8 6 9 5.6 9 4.4 9 3.6 8.6 3.2 8.6 2.4" stroke="#C89A6B" stroke-width="1.1" fill="none" stroke-linecap="round" style="animation:steam 3.2s ease-out infinite"/><path d="M12 7.5c0-1.5 1-1.9 1-3.1 0-.8-.4-1.2-.4-2" stroke="#C89A6B" stroke-width="1.1" fill="none" stroke-linecap="round" style="animation:steam 3.2s ease-out 1.1s infinite"/></svg>`,
  send:`<span class="circle" style="background:#6F4022;box-shadow:inset 0 0 0 2.5px rgba(232,213,184,.8)">${sf('paperplane.fill',13)}</span>`,
  user:'How is a flat white different from a cappuccino?', t1:'8:12', t2:'8:12',
  bot:'Less milk, closer coffee: a double ristretto and thin microfoam ~0.5 cm — the espresso leads, not the milk.',
  bullet:'—', dictLang:'IT', dur:'0:09', voiceText:'One, two, three.',
  fmt:{h:'The morning cup',items:['18 g — grind a touch finer','warm the cup, 93 °C','pull 27–29 s to a nutty finish'],
       lang:'RECIPE',code:'ratio = 1:2  # 18 g → 36 g',inline:'crema',link:'Roast journal',
       quote:'Coffee is a hug in a mug.',tbl:[['Grind','2 clicks finer'],['Temperature','93 °C']],artifact:'Recipe-of-the-week.html'},
  deco(dark,wt){
    const ring=dark?'rgba(217,160,91,.22)':'rgba(140,90,60,.18)',
          ring2=dark?'rgba(217,160,91,.1)':'rgba(140,90,60,.08)',

    const beanSvg=(st)=>`<svg style="${st}" width="11" height="8" viewBox="0 0 14 10"><ellipse cx="7" cy="5" rx="6.4" ry="4.4" fill="${bean}"/><path d="M2.4 2Q7 5 11.6 8" stroke="${cut}" stroke-width="1.1" fill="none"/></svg>`;
    if(wt) return `<span style="position:absolute;right:-26px;top:-26px;width:74px;height:74px;border-radius:50%;border:5px solid ${ring};box-shadow:inset 0 0 0 2px ${ring2}"></span>
      ${beanSvg('position:absolute;left:150px;bottom:8px;transform:rotate(-24deg)')}${beanSvg('position:absolute;left:166px;bottom:4px;transform:rotate(40deg)')}`;
    return `<span style="position:absolute;right:-24px;top:118px;width:74px;height:74px;border-radius:50%;border:5px solid ${ring};box-shadow:inset 0 0 0 2px ${ring2}"></span>
      <span style="position:absolute;left:-18px;top:40px;width:52px;height:52px;border-radius:50%;border:4px solid ${ring2};box-shadow:inset 0 0 0 1.5px ${ring2}"></span>

  }},
];

/* ═══ the frame: header (pin·folder·provider·…·presets·│·pencil·⚙) ═══ */
const header=()=>`<div class="phead">

const composer=(t)=>`<div class="compwrap">

const chatPanel=(t,dark)=>`<div class="stage chat ${t.id} ${dark?'dark':'light'}">

/* ═══ the component sheet ═══ */
const compSheet=(t,dark)=>`<div class="stage ${t.id} ${dark?'dark':'light'}" style="height:auto">
  <div class="sheet">
    <div class="blk"><span class="lbl">DICTATION · DICTATIONWIDGETVIEW — 148×34 / 182×34 · 14 bars 2.5/2.5, h 3–18</span>

          <span class="thumbwrap"><span class="thumb"></span><span class="x">✕</span></span>

        <span class="retry">${sf('arrow.clockwise',11)} Retry</span></div></div>
    ${composer(t)}
  </div><span class="badge">${dark?'DARK':'LIGHT'}</span></div>`;

/* ═══ markdown and media ═══ */
const mdSheet=(t,dark)=>{const f=t.fmt;
  return `<div class="stage ${t.id} ${dark?'dark':'light'}" style="height:auto">
  <div class="sheet">
    <div class="blk"><span class="lbl">FORMATTING · MARKDOWNBLOCKSVIEW</span>
      <div class="md"><h3>${f.h}</h3>

    <div class="blk"><span class="lbl">MERMAID · MERMAIDBLOCKVIEW</span>
      <div class="mmd"><svg width="240" height="54" viewBox="0 0 240 54" fill="none">
        <rect x="2" y="14" width="62" height="26" rx="7" stroke="var(--ink)" stroke-width="1.3"/>
        <rect x="92" y="14" width="62" height="26" rx="7" stroke="var(--ink)" stroke-width="1.3"/>

        <text x="33" y="31" text-anchor="middle" fill="var(--text)" font-size="9" font-family="ui-monospace">idea</text>

    <div class="blk"><span class="lbl">ARTIFACT · ARTIFACTCARDVIEW</span>

        <span class="pill">${sf('arrow.up.backward.and.arrow.down.forward.rectangle',12)} Upscale ${sf('chevron.down',7)}</span>

/* ═══ agent surfaces (AgentApprovalCard verbatim from the code) ═══ */

  </div><span class="badge">${dark?'DARK':'LIGHT'}</span></div>`;

/* ═══ world time: the anatomy of WorldTimeView, verbatim ═══ */
const WT_CITIES=[
  {name:'Moscow',country:'Russia',abbr:'MSK',off:0,home:true, clock:'16:32'},
  {name:'London',country:'United Kingdom',abbr:'BST',off:-2,label:'−2',clock:'14:32'},
  {name:'New York',country:'United States',abbr:'EDT',off:-7,label:'−7',clock:'9:32'},
  {name:'Tokyo',country:'Japan',abbr:'JST',off:6,label:'+6',clock:'22:32'},
];
const kindOf=h=>h===0?'mid':(h<6?'night':(h<9?'dawn':(h<18?'day':(h<22?'dusk':'night'))));
const CELL_BG={mid:'--wt-mid',night:'--wt-night',dawn:'--wt-dawn',day:'--wt-day',dusk:'--wt-dusk'};
const MIDS={'Moscow':['THU','25','DEC'],'London':['THU','25','DEC'],'New York':['THU','25','DEC'],'Tokyo':['FRI','26','DEC']};
const NOW_COL=16, SEL_COL=16;

const wtPanel=(t,dark)=>{
  const rows=WT_CITIES.map(c=>{
    const cells=[...Array(24)].map((_,col)=>{
      const h=((col+c.off)%24+24)%24, k=kindOf(h), isNow=col===NOW_COL;
      const dkText=(k==='mid'||k==='night')?' dk':'';
      const inner=k==='mid'
        ? `<span class="mEEE">${MIDS[c.name][0]}</span><span class="mD">${MIDS[c.name][1]}</span><span class="mMMM">${MIDS[c.name][2]}</span>`
        : `<span class="h">${h}</span>`;
      return `<span class="cell${dkText}" style="background:var(${CELL_BG[k]})">${inner}${isNow&&k!=='mid'?'<span class="noww"></span>':''}</span>`;
    }).join('');
    return `<div class="wtrow">
      <span class="rowhead">
        <span class="off">${c.home?sf('house.fill',11):c.label}</span>
        <span class="names"><span class="cityline"><span class="city">${c.name}</span><span class="abbr">${c.abbr}</span></span>
          <span class="country">${c.country}</span></span>
        <span class="clock"><b>${c.clock}</b><span>Thu, Dec 25</span></span>
      </span>
      <span class="band">${cells}</span></div>`;
  }).join('');
  // the selection column: headerW 250 + cellW*(col..col+1), across all 4 rows
  const bandW=1000-32-250, cellW=bandW/24;
  const selLeft=250+cellW*SEL_COL-2, selW=cellW+4;
  const days=[['24',''],['Dec 25','sel'],['26',''],['27',''],['28',''],['29','wknd'],['30','wknd']]
    .map(([d,c])=>`<span class="day ${c}">${d}</span>`).join('');
  return `<div class="wtstage ${t.id} ${dark?'dark':'light'}">
    <div class="wtpanel"><div class="deco">${t.deco(dark,true)}</div>
      <div class="drag"><i></i></div>
      <div class="wtbar">
        ${sf('xmark.circle.fill',15,'color:var(--sec)')}
        ${sf('pin',13,'color:var(--sec)')}
        <span class="wtsearch">${sf('plus',11,'color:var(--sec)')}<span>City or time zone</span></span>
        <span style="flex:1"></span>
        <span class="wtlink">Apple Calendar</span>
        <span class="seg"><i>AM/PM</i><i class="on">24</i></span>
        ${sf('gearshape',13,'color:var(--link)')}
      </div>
      <div class="dstrip">
        ${sf('calendar',13,'color:var(--sec)')}
        ${days}
        <span style="font-size:11px;color:var(--link)">Today</span>
        <span style="flex:1"></span>
      </div>
      <div class="busylane"><span class="cap">Busy</span>
        <div class="track"><span class="rail"></span>
          <span class="bl" style="left:44%;width:9%;background:#3478f6"></span>
          <span class="bl" style="left:58%;width:4%;background:#f6a034"></span></div></div>
      <div class="wtgrid">${rows}
        <span class="selcol" style="left:${selLeft.toFixed(1)}px;top:-3px;bottom:-3px;width:${selW.toFixed(1)}px"></span>
      </div>
    </div><span class="badge">${dark?'DARK':'LIGHT'}</span></div>`};

/* ═══ sections + table of contents ═══ */
const sections=document.getElementById('sections'), nav=document.querySelector('.nav');
THEMES.forEach((t,ti)=>{
  nav.insertAdjacentHTML('beforeend',
    `<span class="g">${t.name.split(' — ')[0]}:</span>
     <a href="#${t.id}-chat">chat</a><a href="#${t.id}-comp">components</a><a href="#${t.id}-md">markdown</a><a href="#${t.id}-agent">agent</a><a href="#${t.id}-wt">time</a>`);
  const sect=(anchor,tag,title,note,body)=>`<div id="${anchor}" style="display:flex;flex-direction:column;gap:10px">
    <div class="sect"><span class="tag">${tag}</span><span class="ttl">${title}</span><a href="#top">↑ contents</a></div>
    <div class="note">${note}</div>${body}</div>`;
  sections.insertAdjacentHTML('beforeend',
    sect(`${t.id}-chat`,`${ti+1}a`,`${t.name} — chat`,t.note,
      `<div class="pair">${chatPanel(t,true)}${chatPanel(t,false)}</div>`)+
    sect(`${t.id}-comp`,`${ti+1}b`,`${t.name} — components`,
      'DictationWidgetView · RecordingStatusView · VoiceMessagePlayer · ThinkingIndicator · attachment · Retry',
      `<div class="pair">${compSheet(t,true)}${compSheet(t,false)}</div>`)+
    sect(`${t.id}-md`,`${ti+1}c`,`${t.name} — markdown and media`,
      'MarkdownBlocksView (table, divider) · MermaidBlockView · ArtifactCardView · image action pills',
      `<div class="pair">${mdSheet(t,true)}${mdSheet(t,false)}</div>`)+
    sect(`${t.id}-agent`,`${ti+1}d`,`${t.name} — agent surfaces`,
      'AgentApprovalCard (strings and buttons from Localization) · AgentStepJournalView · AgentRoleChip · file pills',
      `<div class="pair">${agentSheet(t,true)}${agentSheet(t,false)}</div>`)+
    sect(`${t.id}-wt`,`${ti+1}e`,`${t.name} — world time`,
      'the anatomy of WorldTimeView: ✕·pin·search on the left, link+AM/PM|24+⚙ on the right · the day row · busy lane · rows of 46 (offset, TZ chip, live clock) · the midnight chip · "now" inside the cell · the selection column',
      `<div class="col">${wtPanel(t,true)}${wtPanel(t,false)}</div>`));
});
</script>
